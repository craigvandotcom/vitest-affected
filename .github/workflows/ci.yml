name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: quality-gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Each step runs ONE stage of the single-sourced gate defined in
      # scripts/quality-gate.sh (the canonical step definitions live there, so
      # this workflow carries no literal build/type/test commands to drift).
      # Build MUST stay first: on a fresh checkout dist/ is absent and
      # tools/replay imports the BUILT artifact by design, so type-checking
      # before building fails with TS2307 (commit 155bece / 2026-07-11 —
      # dist freshness is the gate's job). The final step disables the affected
      # plugin internally (inside the script) so the suite always exercises
      # every test; path canonicalization keeps the matrix green on Linux + macOS.
      - name: Build
        run: bash scripts/quality-gate.sh build

      # CI-only harness-entry smoke (single-sourced in scripts/quality-gate.sh).
      # Runs AFTER Build: it drives `npx tsx tools/replay/run.ts`, whose static
      # ../../dist import chain loads at module-eval regardless of branch. Fast
      # (<~2 min: --help + --analyze-only over a tiny fixture, no walk/installs).
      - name: Smoke (harness CLI entry)
        run: bash scripts/quality-gate.sh smoke

      - name: Type-check
        run: bash scripts/quality-gate.sh types

      - name: Type-check tests
        run: bash scripts/quality-gate.sh test-types

      - name: Test (full suite, plugin disabled)
        run: bash scripts/quality-gate.sh tests
